<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diamond House — Property Management & Organization</title>
<style>
:root {
  --bg: #0b0d14;
  --surface: #12151f;
  --card: #181c2a;
  --card2: #1e2334;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.13);
  --gold: #c8a84b;
  --gold-lt: #e0c97a;
  --gold-dim: rgba(200,168,75,0.13);
  --text: #e6eaf6;
  --muted: #7a86a4;
  --dim: #3a4260;
  --ok: #34d399; --ok-d: rgba(52,211,153,0.13);
  --warn: #f5a623; --warn-d: rgba(245,166,35,0.13);
  --danger: #f87171; --danger-d: rgba(248,113,113,0.13);
  --info: #60a5fa; --info-d: rgba(96,165,250,0.13);
  --coral: #f0856a; --coral-d: rgba(240,133,106,0.13);
  --violet: #a78bfa; --violet-d: rgba(167,139,250,0.13);
  --sidebar: 232px;
  --hdr: 54px;
  --r: 10px;
  --rs: 6px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
button{cursor:pointer;border:none;background:none;color:inherit;font:inherit}
input,textarea,select{font:inherit;color:var(--text);background:var(--card2);border:1px solid var(--border2);border-radius:var(--rs);padding:8px 12px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--gold)}
select option{background:#1e2334}

/* ── Header ─────────────────── */
#hdr{height:var(--hdr);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:16px;position:fixed;top:0;left:0;right:0;z-index:100}
.brand{display:flex;align-items:center;gap:9px;font-family:'Palatino Linotype',Palatino,Georgia,serif;font-size:18px;letter-spacing:0.02em;color:var(--gold-lt);width:var(--sidebar);flex-shrink:0}
.brand-diamond{width:22px;height:22px;background:var(--gold);clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%);flex-shrink:0}
.role-switcher{display:flex;background:var(--card);border:1px solid var(--border2);border-radius:var(--r);padding:3px;gap:2px}
.role-btn{padding:5px 14px;border-radius:7px;font-size:13px;font-weight:500;color:var(--muted);transition:all .18s}
.role-btn.active{background:var(--gold-dim);color:var(--gold-lt);border:1px solid rgba(200,168,75,0.3)}
.hdr-spacer{flex:1}
.prop-select-wrap{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
#propSelect{width:auto;font-size:13px;padding:5px 10px}

/* ── Sidebar ─────────────────── */
#sidebar{width:var(--sidebar);background:var(--surface);border-right:1px solid var(--border);position:fixed;top:var(--hdr);bottom:0;left:0;overflow-y:auto;padding:16px 10px;display:flex;flex-direction:column;gap:4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r);color:var(--muted);cursor:pointer;transition:all .15s;font-size:13px}
.nav-item:hover{background:var(--card);color:var(--text)}
.nav-item.active{background:var(--gold-dim);color:var(--gold-lt);border:1px solid rgba(200,168,75,0.2)}
.nav-icon{width:18px;text-align:center;font-size:15px;flex-shrink:0}
.nav-badge{margin-left:auto;background:var(--danger);color:#fff;border-radius:10px;padding:1px 7px;font-size:11px;font-weight:600}
.nav-badge.gold{background:var(--gold);color:#0b0d14}

/* ── Main ─────────────────────── */
#main{margin-left:var(--sidebar);margin-top:var(--hdr);padding:28px 28px;min-height:calc(100vh - var(--hdr))}
.page-title{font-family:'Palatino Linotype',Palatino,Georgia,serif;font-size:24px;font-weight:400;color:var(--gold-lt);margin-bottom:6px}
.page-sub{color:var(--muted);font-size:13px;margin-bottom:24px}
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer;margin-bottom:12px}
.back-link:hover{color:var(--gold-lt)}

/* ── Stat Cards ───────────────── */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px}
.stat-label{font-size:11px;font-weight:600;letter-spacing:0.07em;color:var(--muted);text-transform:uppercase;margin-bottom:8px}
.stat-value{font-size:28px;font-weight:600;line-height:1;color:var(--text)}
.stat-sub{font-size:12px;color:var(--muted);margin-top:6px}
.stat-accent{color:var(--gold)}
.stat-danger{color:var(--danger)}

/* ── Cards / layout ───────────── */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:20px}
.card-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.card-title small{font-size:12px;font-weight:400;color:var(--muted)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
.three-col{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}

/* ── Property cards ───────────── */
.prop-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:border-color .18s}
.prop-card:hover{border-color:var(--gold)}
.prop-thumb{height:90px;background:linear-gradient(135deg,#1a2040 0%,#0d1030 100%);display:flex;align-items:center;justify-content:center;font-size:44px;position:relative}
.prop-status-badge{position:absolute;top:10px;right:10px}
.prop-body{padding:14px 16px}
.prop-name{font-family:'Palatino Linotype',Palatino,Georgia,serif;font-size:15px;color:var(--gold-lt);margin-bottom:3px}
.prop-addr{font-size:12px;color:var(--muted);margin-bottom:10px}
.prop-owner{font-size:12px;color:var(--muted)}
.prop-stats{display:flex;gap:12px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.prop-stat{text-align:center;flex:1}
.prop-stat-n{font-size:16px;font-weight:600;color:var(--text)}
.prop-stat-l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}

/* ── Badges ───────────────────── */
.badge{display:inline-flex;align-items:center;border-radius:20px;padding:3px 10px;font-size:11px;font-weight:600;letter-spacing:.03em;white-space:nowrap}
.badge-ok{background:var(--ok-d);color:var(--ok)}
.badge-warn{background:var(--warn-d);color:var(--warn)}
.badge-danger{background:var(--danger-d);color:var(--danger)}
.badge-info{background:var(--info-d);color:var(--info)}
.badge-dim{background:var(--card2);color:var(--muted)}
.badge-gold{background:var(--gold-dim);color:var(--gold-lt)}
.badge-violet{background:var(--violet-d);color:var(--violet)}

/* ── Task rows ─────────────────── */
.task-list{display:flex;flex-direction:column;gap:8px}
.task-row{background:var(--card);border:1px solid var(--border);border-radius:var(--rs);padding:12px 16px;display:grid;grid-template-columns:22px 1fr auto auto auto;align-items:center;gap:12px;transition:background .15s}
.task-row:hover{background:var(--card2)}
.task-check{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;cursor:pointer}
.task-check.done{background:var(--ok-d);border-color:var(--ok);color:var(--ok)}
.task-title-col{min-width:0}
.task-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-name.done{color:var(--muted);text-decoration:line-through}
.task-meta{font-size:11px;color:var(--muted);margin-top:2px}
.task-cat{font-size:11px;background:var(--card2);color:var(--muted);border-radius:4px;padding:2px 8px;white-space:nowrap}
.task-date{font-size:11px;color:var(--muted);white-space:nowrap}
.task-date.over{color:var(--danger);font-weight:600}
.filter-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filter-btn{padding:5px 14px;border-radius:20px;font-size:12px;font-weight:500;color:var(--muted);background:var(--card);border:1px solid var(--border);cursor:pointer;transition:all .15s}
.filter-btn.active{background:var(--gold-dim);color:var(--gold-lt);border-color:rgba(200,168,75,0.3)}

/* ── Tabs ──────────────────────── */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:20px}
.tab{padding:9px 18px;font-size:13px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;transition:all .15s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--gold-lt);border-bottom-color:var(--gold)}

/* ── Systems ───────────────────── */
.sys-cat-head{display:flex;align-items:center;gap:10px;margin:22px 0 10px;font-size:13px;font-weight:600;color:var(--text)}
.sys-cat-head:first-child{margin-top:0}
.sys-cat-icon{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:15px}
.sys-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.sys-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;cursor:pointer;transition:border-color .15s}
.sys-card:hover{border-color:var(--border2)}
.sys-card.open{border-color:rgba(200,168,75,0.35)}
.sys-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.sys-name{font-size:13px;font-weight:600;line-height:1.35}
.sys-model{font-size:11px;color:var(--muted);margin-top:2px}
.sys-meta{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.sys-meta-item{font-size:11px}
.sys-meta-l{color:var(--dim);text-transform:uppercase;letter-spacing:.05em;font-size:9.5px;font-weight:600}
.sys-meta-v{color:var(--muted);margin-top:1px}
.sys-meta-v.hot{color:var(--warn)}
.sys-meta-v.bad{color:var(--danger)}
.sys-history{margin-top:12px;padding-top:10px;border-top:1px dashed var(--border2)}
.sys-hist-item{display:flex;gap:8px;font-size:11.5px;color:var(--muted);padding:4px 0;line-height:1.4}
.sys-hist-date{color:var(--dim);white-space:nowrap;min-width:72px}
.sys-note{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.5;font-style:italic}

/* ── Schedule rows ─────────────── */
.sched-row{background:var(--card);border:1px solid var(--border);border-radius:var(--rs);padding:12px 16px;display:grid;grid-template-columns:34px 1fr auto auto auto;align-items:center;gap:12px}
.sched-icon{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:15px;background:var(--card2)}
.sched-freq{font-size:11px;color:var(--muted);background:var(--card2);border-radius:4px;padding:2px 8px;white-space:nowrap}
.sched-group-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin:18px 0 8px}

/* ── Inventory ─────────────────── */
.inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.inv-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;transition:border-color .15s}
.inv-card:hover{border-color:var(--border2)}
.inv-header{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.inv-icon{width:38px;height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.inv-name{font-size:13px;font-weight:600;line-height:1.3;margin-bottom:3px}
.inv-room{font-size:11px;color:var(--muted)}
.inv-detail{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.inv-d-item{font-size:11px}
.inv-d-l{color:var(--dim);font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.inv-d-v{color:var(--muted);margin-top:1px}
.inv-footer{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.inv-value{font-size:14px;font-weight:600;color:var(--gold)}
.inv-flags{display:flex;gap:5px}
.inv-flag{font-size:12px;opacity:.85;cursor:default}
.inv-notes{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.5}

/* ── Storage / containers ──────── */
.cont-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.cont-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;cursor:pointer;transition:border-color .15s}
.cont-card:hover{border-color:var(--border2)}
.cont-card.open{border-color:rgba(200,168,75,0.35)}
.cont-head{display:flex;align-items:flex-start;gap:12px}
.cont-icon{width:42px;height:42px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0;background:var(--card2)}
.cont-name{font-size:13px;font-weight:600;margin-bottom:2px}
.cont-loc{font-size:11px;color:var(--muted);line-height:1.4}
.cont-count{margin-left:auto;text-align:right;flex-shrink:0}
.cont-count-n{font-size:20px;font-weight:600;color:var(--gold)}
.cont-count-l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.cont-items{margin-top:12px;padding-top:10px;border-top:1px dashed var(--border2)}
.cont-item{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);padding:4px 0}
.cont-item .linked{color:var(--gold-lt)}
.cont-item-dot{width:5px;height:5px;border-radius:50%;background:var(--dim);flex-shrink:0}

/* ── Search / Find my stuff ────── */
.search-hero{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:26px 24px;margin-bottom:20px;text-align:center}
.search-hero input{max-width:520px;margin:0 auto;font-size:15px;padding:12px 18px;text-align:center}
.search-hint{font-size:12px;color:var(--muted);margin-top:10px}
.result-row{background:var(--card);border:1px solid var(--border);border-radius:var(--rs);padding:12px 16px;display:flex;align-items:center;gap:14px;margin-bottom:8px}
.result-icon{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:17px;background:var(--card2);flex-shrink:0}
.result-name{font-size:13px;font-weight:600}
.result-where{font-size:11.5px;color:var(--muted);margin-top:2px}
.result-where b{color:var(--gold-lt);font-weight:600}

/* ── Staff ─────────────────────── */
.staff-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-bottom:24px}
.staff-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:18px 16px;text-align:center}
.avatar{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;margin:0 auto 12px}
.av-blue{background:rgba(96,165,250,0.2);color:var(--info)}
.av-teal{background:rgba(52,211,153,0.2);color:var(--ok)}
.av-green{background:rgba(74,222,128,0.2);color:#4ade80}
.av-amber{background:rgba(251,191,36,0.2);color:var(--warn)}
.av-coral{background:rgba(240,133,106,0.2);color:var(--coral)}
.av-violet{background:rgba(167,139,250,0.2);color:var(--violet)}
.staff-name{font-size:14px;font-weight:600;margin-bottom:4px}
.staff-role{font-size:12px;color:var(--muted);margin-bottom:10px}
.staff-stats{display:flex;justify-content:center;gap:16px}
.staff-stat{text-align:center}
.staff-stat-n{font-size:18px;font-weight:600}
.staff-stat-l{font-size:10px;color:var(--muted)}

/* ── Activity feed ─────────────── */
.feed{display:flex;flex-direction:column;gap:0}
.feed-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);align-items:flex-start}
.feed-item:last-child{border-bottom:none}
.feed-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0}
.feed-text{font-size:13px;line-height:1.45}
.feed-time{font-size:11px;color:var(--muted);margin-top:2px}

/* ── Request form ──────────────── */
.req-form{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:20px}
.form-row{margin-bottom:14px}
.form-label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.submit-btn{background:var(--gold);color:#0b0d14;border-radius:var(--rs);padding:9px 22px;font-size:13px;font-weight:700;letter-spacing:.03em;border:none;cursor:pointer;transition:opacity .15s}
.submit-btn:hover{opacity:.88}
.ghost-btn{background:var(--card2);color:var(--text);border:1px solid var(--border2);border-radius:var(--rs);padding:8px 18px;font-size:12.5px;font-weight:600;cursor:pointer;transition:border-color .15s}
.ghost-btn:hover{border-color:var(--gold)}

/* ── Toast ─────────────────────── */
#toast{position:fixed;bottom:24px;right:24px;background:var(--card2);border:1px solid rgba(200,168,75,0.4);border-radius:var(--r);padding:13px 20px;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.5);z-index:300;opacity:0;transform:translateY(12px);transition:all .25s;pointer-events:none;max-width:380px;line-height:1.45}
#toast.show{opacity:1;transform:translateY(0)}

/* ── Scrollbar ─────────────────── */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--dim);border-radius:3px}
</style>
</head>

<!-- Header -->
<div id="hdr">

    Diamond House

      <option value="1">The Whitmore Estate</option>

      <option value="3">The Hargrove Residence</option>

  </div>
</div>

<!-- Sidebar -->
<div id="sidebar"></div>

<!-- Main -->
<div id="main"></div>

<!-- Toast -->
<div id="toast"></div>

const SYSTEMS=[
  // ── Whitmore Estate ──

function statusBadge(s){
  if(s==="complete")return`<span class="badge badge-ok">Complete</span>`;
  if(s==="in-progress")return`<span class="badge badge-info">In Progress</span>`;
  if(s==="pending")return`<span class="badge badge-warn">Pending</span>`;
  return`<span class="badge badge-dim">${s}</span>`;
}
function priorityBadge(p){
  if(p==="high")return`<span class="badge badge-danger">High</span>`;
  if(p==="medium")return`<span class="badge badge-warn">Med</span>`;
  return`<span class="badge badge-dim">Low</span>`;
}
function sysBadge(s){
  if(s==="ok")return`<span class="badge badge-ok">Healthy</span>`;
  if(s==="due")return`<span class="badge badge-warn">Service Due</span>`;
  if(s==="warn")return`<span class="badge badge-warn">Watch</span>`;
  if(s==="issue")return`<span class="badge badge-danger">Issue</span>`;
  return`<span class="badge badge-dim">${s}</span>`;
}
function dueBadge(d){
  if(d==="overdue")return`<span class="badge badge-danger">Overdue</span>`;
  if(d==="due")return`<span class="badge badge-warn">Due Soon</span>`;
  return`<span class="badge badge-dim">Scheduled</span>`;
}

        ${flagged.map(s=>{const st=getStaff(s.who);return`<div class="task-row" style="grid-template-columns:34px 1fr auto auto">
          <div class="sched-icon">${getCat(s.cat).icon}</div>
          <div class="task-title-col">
            <div class="task-name">${s.name}</div>
            <div class="task-meta">${s.notes||s.nextSvc} · ${st.name} is on it</div>
          </div>
          ${sysBadge(s.status)}
          <span class="task-date">${s.nextSvc}</span>
        </div>`}).join("")}
      </div>
    </div>`:""}
    <div class="two-col">
      <div class="card">
        <div class="card-title">Current & Upcoming</div>
        <div class="task-list">
          ${open.length?open.map(t=>{
            const s=getStaff(t.who);
            return`<div class="task-row" style="grid-template-columns:22px 1fr auto">
              <div class="task-check">&nbsp;</div>
              <div class="task-title-col">
                <div class="task-name">${t.title}</div>
                <div class="task-meta">${s.name} · ${t.date}</div>
              </div>
              ${statusBadge(t.status)}
            </div>`;}).join(""):'<div style="text-align:center;padding:24px;color:var(--muted)">All caught up ✓</div>'}
        </div>
        ${sched.length?`<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border)">
          <div class="sys-meta-l" style="margin-bottom:8px">Scheduled maintenance coming up</div>
          ${sched.map(r=>`<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:4px 0"><span>${getCat(r.cat).icon} ${r.title}</span><span class="${r.due==='overdue'?'task-date over':''}">${r.next}</span></div>`).join("")}
        </div>`:""}
      </div>
      <div class="card">
        <div class="card-title">Recently Completed</div>
        <div class="task-list">
          ${done.map(t=>{
            const s=getStaff(t.who);
            return`<div class="task-row" style="grid-template-columns:22px 1fr auto">
              <div class="task-check done">✓</div>
              <div class="task-title-col">
                <div class="task-name done">${t.title}</div>
                <div class="task-meta">${s.name} · ${t.note||t.date}</div>
              </div>
              <span class="task-date">${t.date}</span>
            </div>`;}).join("")||'<div style="text-align:center;padding:24px;color:var(--muted)">Nothing yet this month</div>'}
        </div>
      </div>
    </div>`;
}

function renderHomeownerSystems(){
  const p=getProp(selectedProp);
  const systems=propSystems(selectedProp);
  const flagged=systems.filter(s=>s.status!=="ok").length;
  return`
    <div class="page-title">Home Systems</div>
    <div class="page-sub">Everything that keeps ${p.name} running — electrical, plumbing, HVAC, internet, yard, security — with full service history</div>
    <div style="margin-bottom:14px;font-size:13px;color:var(--muted)">${systems.length} systems on record · ${flagged?`<span style="color:var(--warn)">${flagged} flagged</span>`:'<span style="color:var(--ok)">all healthy</span>'}</div>
    ${renderSystemsFor(selectedProp)}`;
}

function renderRequests(){
  const tasks=propTasks(selectedProp);
  return`
    <div class="page-title">Add a Request</div>
    <div class="page-sub">Submit a task or concern — your property manager routes it to the right person</div>
    <div class="req-form">
      <div class="form-row">
        <div class="form-label">What needs attention?</div>
        <input type="text" id="req-title" placeholder="e.g. Pool light flickering, Wi-Fi slow upstairs, sprinkler zone not running...">
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="form-row">
          <div class="form-label">Category</div>
          <select id="req-cat">
            <option>Plumbing</option><option>Electrical</option><option>HVAC</option>
            <option>Internet</option><option>Yard Work</option><option>Pool & Spa</option>
            <option>Cleaning</option><option>Security</option><option>Maintenance</option><option>Other</option>
          </select>
        </div>
        <div class="form-row">
          <div class="form-label">Priority</div>
          <select id="req-priority">
            <option value="low">Low – No rush</option>
            <option value="medium" selected>Medium – When possible</option>
            <option value="high">High – Urgent</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-label">Additional notes</div>
        <textarea id="req-note" rows="3" placeholder="Any helpful details, location in the home, photos description..."></textarea>
      </div>
      <button class="submit-btn" onclick="submitRequest()">Submit Request</button>
    </div>
    <div class="card">
      <div class="card-title">Your Requests <small>${tasks.length} total</small></div>
      <div class="task-list">
        ${tasks.map(t=>{
          const s=getStaff(t.who);
          return`<div class="task-row" style="grid-template-columns:22px 1fr auto auto">
            <div class="task-check ${t.status==="complete"?"done":""}">${t.status==="complete"?"✓":""}</div>
            <div class="task-title-col">
              <div class="task-name ${t.status==="complete"?"done":""}">${t.title}</div>
              <div class="task-meta">Assigned to ${s.name} · ${t.date}</div>
            </div>
            ${statusBadge(t.status)}
            ${priorityBadge(t.priority)}
          </div>`;}).join("")}
      </div>
    </div>`;
}

function renderInventoryView(){
  const inv=propInv(selectedProp);
  const rooms=[...new Set(inv.map(i=>i.containerId?getContainer(i.containerId).label:i.room))];
  const filtered=invRoom==="all"?inv:inv.filter(i=>(i.containerId?getContainer(i.containerId).label:i.room)===invRoom);
  const totalVal=inv.reduce((a,i)=>a+i.val,0);
  const viewVal=filtered.reduce((a,i)=>a+i.val,0);
  const receipts=inv.filter(i=>i.receipt).length;
  const photos=inv.reduce((a,i)=>a+i.photos,0);
  return`
    <div class="page-title">Home Inventory</div>
    <div class="page-sub">Every item documented — serials, receipts, photos, values. Ready for an insurance claim before you ever need one.</div>
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Items</div><div class="stat-value">${inv.length}</div><div class="stat-sub">${photos} photos attached</div></div>
      <div class="stat-card"><div class="stat-label">Documented Value</div><div class="stat-value" style="font-size:22px">${fmt(totalVal)}</div><div class="stat-sub">Estimated replacement</div></div>
      <div class="stat-card"><div class="stat-label">Receipts on File</div><div class="stat-value">${receipts}<span style="font-size:15px;color:var(--muted)"> / ${inv.length}</span></div><div class="stat-sub">Proof of purchase</div></div>
      <div class="stat-card" style="display:flex;flex-direction:column;justify-content:center;gap:8px">
        <button class="submit-btn" style="width:100%" onclick="insuranceReport()">📄 Insurance Report</button>
        <button class="ghost-btn" style="width:100%" onclick="toast('📷 In the full app: snap a photo, and the item — name, serial, value — is added automatically.')">+ Add Item</button>
      </div>
    </div>
    <div class="filter-bar">
      <button class="filter-btn ${invRoom==="all"?"active":""}" onclick="setInvRoom('all')">All Locations</button>
      ${rooms.map(r=>`<button class="filter-btn ${invRoom===r?"active":""}" onclick="setInvRoom('${r.replace(/'/g,"\\'")}')">${r}</button>`).join("")}
    </div>
    <div style="margin-bottom:16px;display:flex;align-items:center;gap:12px">
      <span style="font-size:13px;color:var(--muted)">${filtered.length} items ·</span>
      <span class="badge badge-gold">${fmt(viewVal)} in view</span>
    </div>
    <div class="inv-grid">
      ${filtered.map(renderInvCard).join("")}
      ${!filtered.length?'<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--muted)">No items in this location</div>':""}
    </div>`;
}

function renderStorage(){
  const conts=propConts(selectedProp);
  const totalItems=conts.reduce((a,c)=>a+contItemCount(c),0);
  return`
    <div class="page-title">Storage & Bins</div>
    <div class="page-sub">Bins, safes, closets, attic totes, offsite units — labeled once, findable forever</div>
    <div style="margin-bottom:16px;display:flex;align-items:center;gap:12px">
      <span class="badge badge-gold">${conts.length} storage locations</span>
      <span class="badge badge-dim">${totalItems} items stored</span>
      <button class="ghost-btn" style="margin-left:auto" onclick="toast('🏷️ In the full app: print a QR label for each bin — scan it with your phone to see the contents without opening the box.')">🏷️ Print QR Labels</button>
    </div>
    <div class="cont-grid">${conts.map(renderContCard).join("")}</div>`;
}

function findResults(q){
  q=q.trim().toLowerCase();
  if(!q)return"";
  const hits=[];
  propInv(selectedProp).forEach(i=>{
    if((i.name+" "+i.cat+" "+i.room+" "+i.notes).toLowerCase().includes(q)){
      const c=getContainer(i.containerId);
      hits.push({icon:i.icon,name:i.name,where:c?`In <b>${c.label}</b> — ${c.loc}`:`<b>${i.room}</b>${i.notes?` — ${i.notes}`:""}`,val:fmt(i.val)});
    }
  });
  propConts(selectedProp).forEach(c=>{
    c.loose.forEach(x=>{
      if(x.toLowerCase().includes(q))hits.push({icon:c.icon,name:x,where:`In <b>${c.label}</b> — ${c.loc}`,val:""});
    });
    if((c.label+" "+c.type+" "+c.loc).toLowerCase().includes(q))
      hits.push({icon:c.icon,name:c.label,where:`${c.type} — ${c.loc} · ${contItemCount(c)} items inside`,val:""});
  });
  if(!hits.length)return`<div style="text-align:center;padding:30px;color:var(--muted)">Nothing found for “${q}” — in the full app, this searches photos too.</div>`;
  return hits.map(h=>`
    <div class="result-row">
      <div class="result-icon">${h.icon}</div>
      <div style="min-width:0;flex:1">
        <div class="result-name">${h.name}</div>
        <div class="result-where">${h.where}</div>
      </div>
      ${h.val?`<span class="inv-value">${h.val}</span>`:""}
    </div>`).join("");
}
function onFindInput(el){
  findQuery=el.value;
  document.getElementById("find-results").innerHTML=findResults(findQuery);
}
function renderFind(){
  return`
    <div class="page-title">Find My Stuff</div>
    <div class="page-sub">One search across every room, bin, safe, closet, and storage unit</div>
    <div class="search-hero">
      <input type="text" id="find-input" value="${findQuery.replace(/"/g,"&quot;")}" placeholder="Try: christmas, passport, watch, coin, wedding..." oninput="onFindInput(this)" autocomplete="off">
      <div class="search-hint">Searches item names, categories, notes, bin contents, and locations</div>
    </div>
    <div id="find-results">${findResults(findQuery)}</div>`;
}

function renderHandlers(){
  const tasks=propTasks(selectedProp);
  const staffOnProp=[...new Set(tasks.map(t=>t.who))].map(id=>getStaff(id));
  return`
    <div class="page-title">Who's Handling It</div>
    <div class="page-sub">Your assigned service team</div>
    <div class="staff-grid" style="margin-bottom:24px">
      ${staffOnProp.map(s=>{
        const myTasks=tasks.filter(t=>t.who===s.id);
        const open=myTasks.filter(t=>t.status!=="complete").length;
        return`<div class="staff-card">
          <div class="avatar ${s.av}">${s.initials}</div>
          <div class="staff-name">${s.name}</div>
          <div class="staff-role">${s.role}</div>
          <div class="staff-stats">
            <div class="staff-stat"><div class="staff-stat-n">${myTasks.length}</div><div class="staff-stat-l">Tasks</div></div>
            <div class="staff-stat"><div class="staff-stat-n" style="color:${open?"var(--warn)":"var(--ok)"}">${open}</div><div class="staff-stat-l">Open</div></div>
          </div>
        </div>`}).join("")}
    </div>
    <div class="card">
      <div class="card-title">Task Assignments</div>
      <div class="task-list">
        ${tasks.map(t=>{
          const s=getStaff(t.who);
          return`<div class="task-row" style="grid-template-columns:34px 1fr auto auto">
            <div class="avatar ${s.av}" style="width:28px;height:28px;font-size:11px;flex-shrink:0;margin:0">${s.initials}</div>
            <div class="task-title-col">
              <div class="task-name">${t.title}</div>
              <div class="task-meta">${s.name} · ${s.role}</div>
            </div>
            ${statusBadge(t.status)}
            <span class="task-date">${t.date}</span>
          </div>`;}).join("")}
      </div>
    </div>`;
}

// ═══════════════════════════════════════════════════════════════════════════════
//  ACTIONS
// ═══════════════════════════════════════════════════════════════════════════════
function toggleTask(id){
  const t=TASKS.find(t=>t.id===id);
  if(!t)return;
  const cycle=["pending","in-progress","complete"];
  t.status=cycle[(cycle.indexOf(t.status)+1)%cycle.length];
  if(t.status==="complete")t.over=false;
  renderAll();
}
function submitRequest(){
  const title=document.getElementById("req-title").value.trim();
  if(!title){toast("Please describe what needs attention.");return;}
  const cat=document.getElementById("req-cat").value;
  const priority=document.getElementById("req-priority").value;
  const note=document.getElementById("req-note").value.trim();
  TASKS.push({id:nextTaskId++,propId:selectedProp,title,cat,status:"pending",who:5,priority,date:"Jul "+(12+TASKS.length%15),over:false,note});
  renderAll();
  toast(`✓ Request submitted — your property manager has been notified.`);
}
function insuranceReport(){
  const inv=propInv(selectedProp);
  const val=inv.reduce((a,i)=>a+i.val,0);
  const receipts=inv.filter(i=>i.receipt).length;
  const photos=inv.reduce((a,i)=>a+i.photos,0);
  toast(`📄 <b>Insurance report generated</b><br>${inv.length} items · ${fmt(val)} documented · ${photos} photos · ${receipts} receipts. In the full app this exports a PDF your adjuster will love.`);
}

// ═══════════════════════════════════════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════════════════════════════════════
function renderAll(){
  document.getElementById("sidebar").innerHTML=renderSidebar();
  let content="";
  if(role==="manager"){
    if(detailProp)content=renderPropDetail();
    else if(view==="dashboard")content=renderManagerDashboard();
    else if(view==="properties")content=renderProperties();
    else if(view==="tasks")content=renderTasksView();
    else if(view==="maintenance")content=renderMaintenance();
    else if(view==="systems")content=renderManagerSystems();
    else if(view==="staff")content=renderStaff();
  } else {
    if(view==="dashboard")content=renderHomeownerDashboard();
    else if(view==="systems")content=renderHomeownerSystems();
    else if(view==="requests")content=renderRequests();
    else if(view==="inventory")content=renderInventoryView();
    else if(view==="storage")content=renderStorage();
    else if(view==="find")content=renderFind();
    else if(view==="handlers")content=renderHandlers();
  }
  document.getElementById("main").innerHTML=content;
  if(view==="find"&&role==="homeowner"){const el=document.getElementById("find-input");if(el)el.focus();}
}
renderAll();
</script>
</body>
</html>
